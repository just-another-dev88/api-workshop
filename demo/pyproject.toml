[project]
name = "todo-api-demo"
version = "1.0.0"
description = "Beginner-friendly FastAPI + SQLite Todo API for the API workshop"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
