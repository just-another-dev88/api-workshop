# CI pipeline - the "assembly line" that checks every change automatically.
#
#  push / pull request
#        │
#        ▼
#  ┌──────────┐   ┌──────────┐   ┌──────────────┐   ┌──────────────┐
#  │  Lint    │──▶│  Tests   │──▶│ Security     │──▶│ Docker build │
#  │ (ruff)   │   │ (pytest) │   │ scans        │   │ + smoke test │
#  └──────────┘   └──────────┘   └──────────────┘   └──────────────┘
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: demo

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: demo/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (style + security rules)
        run: ruff check .
      - name: Unit tests
        run: pytest -v
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t todo-api:ci .
      - name: Run container and hit /health
        run: |
          docker run -d --name todo -p 8000:8000 -e API_KEY=ci-only-key-123 todo-api:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs todo
          exit 1
